site_name: Bibliothèque scolaire
site_description: Cours, fiches de révision et quiz
site_url: https://drslumppower.github.io/school-library/

theme:
  name: material
  language: fr
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest

nav:
  - Accueil: index.md
  - Première:
    - Accueil: premiere/index.md
    - Révision du jour: premiere/revision-du-jour.md
    - Physique-chimie:
      - Éléments chimiques et réactions nucléaires: premiere/physique-chimie/elements-chimiques-reactions-nucleaires-recap.md
      - Couleurs, vision et synthèses: premiere/physique-chimie/chapitre-17-recap.md
      - Lumière, ondes et particules: premiere/physique-chimie/chapitre-18-recap.md
    - Mathématiques:
      - Second degré: premiere/mathematiques/second-degre-partie-1-recap.md
    - Histoire:
      - La Révolution française: premiere/histoire/revolution-francaise-rupture-ancien-regime-recap.md
    - Français:
      - Le Menteur - Corneille: premiere/francais/le-menteur-corneille-recap.md
    - SVT:
      - Organisation cellulaire du vivant: premiere/svt/organisation-cellulaire-du-vivant-recap.md
    - Anglais:
      - Three truths, two lies: premiere/anglais/three-truths-two-lies-recap.md
      - Holiday Survey - Prétérit: premiere/anglais/holiday-survey-preterit-recap.md
    - Sciences de l'ingénieur:
      - Découvrir la spécialité: premiere/sciences-ingenieur/introduction-sciences-ingenieur-recap.md
      - Besoin, exigences et structure: premiere/sciences-ingenieur/besoin-exigences-structure-systeme-recap.md
      - Attacheur AP25: premiere/sciences-ingenieur/etude-cas-attacheur-ap25-recap.md
      - Tondeuse Robomow RL500: premiere/sciences-ingenieur/etude-cas-tondeuse-robomow-rl500-recap.md
  - Quatrième:
    - Accueil: quatrieme/index.md
    - Révision du jour: quatrieme/revision-du-jour.md
    - Histoire:
      - Commerce atlantique, traites négrières et esclavage: quatrieme/histoire/commerce-atlantique-traite-negriere-recap.md
    - Français:
      - Happy Meal - Anna Gavalda: quatrieme/francais/happy-meal-anna-gavalda-recap.md
      - La nouvelle réaliste et La Parure: quatrieme/francais/nouvelle-realiste-la-parure-recap.md
    - Anglais:
      - Le présent simple: quatrieme/anglais/present-simple-recap.md
      - Dates and describing a picture: quatrieme/anglais/dates-description-image-recap.md
    - Mathématiques:
      - Addition et soustraction de relatifs: quatrieme/mathematiques/addition-soustraction-relatifs-recap.md
      - Théorème de Pythagore: quatrieme/mathematiques/theoreme-pythagore-recap.md
      - Racines carrées: quatrieme/mathematiques/racines-carrees-recap.md
      - Repérage et constructions géométriques: quatrieme/mathematiques/reperage-espace-constructions-recap.md
    - Physique-Chimie:
      - De l'infiniment petit à l'infiniment grand: quatrieme/physique-chimie/dimensions-univers-recap.md
    - SVT:
      - Plaques lithosphériques et séismes: quatrieme/svt/plaques-lithospheriques-seismes-recap.md
    - Technologie:
      - Information binaire et protocole: quatrieme/technologie/information-binaire-protocole-recap.md
      - Du besoin au cahier des charges: quatrieme/technologie/besoin-cahier-des-charges-recap.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/quiz-progress.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false