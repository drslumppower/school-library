site_name: Bibliothèque scolaire
site_description: Cours, fiches de révision et quiz
site_url: https://drslumppower.github.io/school-library/

theme:
  name: material
  language: fr
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Accueil: index.md
  - Révision du jour: revision-du-jour.md
  - Physique-chimie:
      - Récap express: physique-chimie/chapitre-17-recap.md
      - Quiz: physique-chimie/chapitre-17-quiz.md
      - Fiche de révision: physique-chimie/chapitre-17-fiche.md
      - Cours détaillé: physique-chimie/chapitre-17-couleurs.md
  - Mathématiques:
      - Récap express: mathematiques/second-degre-partie-1-recap.md
      - Quiz: mathematiques/second-degre-partie-1-quiz.md
      - Fiche de révision: mathematiques/second-degre-partie-1-fiche.md
      - Cours détaillé: mathematiques/second-degre-partie-1.md
  - Français:
      - Récap express: francais/le-menteur-corneille-recap.md
      - Quiz: francais/le-menteur-corneille-quiz.md
      - Fiche de révision: francais/le-menteur-corneille-fiche.md
      - Cours détaillé: francais/le-menteur-corneille.md
  - SVT:
      - Récap express: svt/organisation-cellulaire-du-vivant-recap.md
      - Quiz: svt/organisation-cellulaire-du-vivant-quiz.md
      - Fiche de révision: svt/organisation-cellulaire-du-vivant-fiche.md
      - Cours détaillé: svt/organisation-cellulaire-du-vivant.md
  - Anglais:
      - Récap express: anglais/three-truths-two-lies-recap.md
      - Quiz: anglais/three-truths-two-lies-quiz.md
      - Fiche de révision: anglais/three-truths-two-lies-fiche.md
      - Cours détaillé: anglais/three-truths-two-lies.md
  - Sciences de l'ingénieur:
      - La spécialité Sciences de l'Ingénieur(e):
        - Récap express: sciences-ingenieur/introduction-sciences-ingenieur-recap.md
        - Quiz: sciences-ingenieur/introduction-sciences-ingenieur-quiz.md
        - Fiche de révision: sciences-ingenieur/introduction-sciences-ingenieur-fiche.md
        - Cours détaillé: sciences-ingenieur/introduction-sciences-ingenieur.md
      - SI 1-1 - Comment apporter la meilleure réponse à un besoin ?:
        - Théorie:
          - Récap express: sciences-ingenieur/besoin-exigences-structure-systeme-recap.md
          - Quiz: sciences-ingenieur/besoin-exigences-structure-systeme-quiz.md
          - Fiche de révision: sciences-ingenieur/besoin-exigences-structure-systeme-fiche.md
          - Cours détaillé: sciences-ingenieur/besoin-exigences-structure-systeme.md
        - TD - Attacheur AP25:
          - Récap express: sciences-ingenieur/etude-cas-attacheur-ap25-recap.md
          - Quiz: sciences-ingenieur/etude-cas-attacheur-ap25-quiz.md
          - Fiche de révision: sciences-ingenieur/etude-cas-attacheur-ap25-fiche.md
          - Étude de cas détaillée: sciences-ingenieur/etude-cas-attacheur-ap25.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false