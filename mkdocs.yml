site_name: Bibliothèque scolaire
site_description: Cours, fiches de révision et quiz
site_url: https://drslumppower.github.io/school-library/

theme:
  name: material
  language: fr
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Accueil: index.md
  - Révision du jour: revision-du-jour.md
  - Physique-chimie:
      - Récap express: physique-chimie/chapitre-17-recap.md
      - Quiz: physique-chimie/chapitre-17-quiz.md
      - Fiche de révision: physique-chimie/chapitre-17-fiche.md
      - Cours détaillé: physique-chimie/chapitre-17-couleurs.md
  - Mathématiques:
      - Récap express: mathematiques/second-degre-partie-1-recap.md
      - Quiz: mathematiques/second-degre-partie-1-quiz.md
      - Fiche de révision: mathematiques/second-degre-partie-1-fiche.md
      - Cours détaillé: mathematiques/second-degre-partie-1.md
  - Français:
      - Récap express: francais/le-menteur-corneille-recap.md
      - Quiz: francais/le-menteur-corneille-quiz.md
      - Fiche de révision: francais/le-menteur-corneille-fiche.md
      - Cours détaillé: francais/le-menteur-corneille.md
  - SVT:
      - Récap express: svt/organisation-cellulaire-du-vivant-recap.md
      - Quiz: svt/organisation-cellulaire-du-vivant-quiz.md
      - Fiche de révision: svt/organisation-cellulaire-du-vivant-fiche.md
      - Cours détaillé: svt/organisation-cellulaire-du-vivant.md
  - Anglais:
      - Récap express: anglais/three-truths-two-lies-recap.md
      - Quiz: anglais/three-truths-two-lies-quiz.md
      - Fiche de révision: anglais/three-truths-two-lies-fiche.md
      - Cours détaillé: anglais/three-truths-two-lies.md
  - Sciences de l'ingénieur:
      - Volet 1 - Récap express: sciences-ingenieur/introduction-sciences-ingenieur-recap.md
      - Volet 1 - Quiz: sciences-ingenieur/introduction-sciences-ingenieur-quiz.md
      - Volet 1 - Fiche: sciences-ingenieur/introduction-sciences-ingenieur-fiche.md
      - Volet 1 - Cours: sciences-ingenieur/introduction-sciences-ingenieur.md
      - Volet 2 - Récap express: sciences-ingenieur/besoin-exigences-structure-systeme-recap.md
      - Volet 2 - Quiz: sciences-ingenieur/besoin-exigences-structure-systeme-quiz.md
      - Volet 2 - Fiche: sciences-ingenieur/besoin-exigences-structure-systeme-fiche.md
      - Volet 2 - Cours: sciences-ingenieur/besoin-exigences-structure-systeme.md
      - Volet 3 - Récap express: sciences-ingenieur/etude-cas-attacheur-ap25-recap.md
      - Volet 3 - Quiz: sciences-ingenieur/etude-cas-attacheur-ap25-quiz.md
      - Volet 3 - Fiche: sciences-ingenieur/etude-cas-attacheur-ap25-fiche.md
      - Volet 3 - Étude de cas: sciences-ingenieur/etude-cas-attacheur-ap25.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false