site_name: Bibliothèque scolaire
site_description: Cours, fiches de révision et quiz
site_url: https://drslumppower.github.io/school-library/

theme:
  name: material
  language: fr
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Accueil: index.md
  - Physique-chimie:
      - Chapitre 17 - Cours: physique-chimie/chapitre-17-couleurs.md
      - Fiche de révision: physique-chimie/chapitre-17-fiche.md
      - Quiz: physique-chimie/chapitre-17-quiz.md
  - Mathématiques:
      - Second degré - Cours: mathematiques/second-degre-partie-1.md
      - Fiche de révision: mathematiques/second-degre-partie-1-fiche.md
      - Quiz: mathematiques/second-degre-partie-1-quiz.md
  - Français:
      - Le Menteur - Cours: francais/le-menteur-corneille.md
      - Fiche de révision: francais/le-menteur-corneille-fiche.md
      - Quiz: francais/le-menteur-corneille-quiz.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false