site_name: Bibliothèque scolaire
site_description: Cours, fiches de révision et quiz
site_url: https://drslumppower.github.io/school-library/

theme:
  name: material
  language: fr
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Accueil: index.md
  - Physique-chimie:
      - Chapitre 17 - Cours: physique-chimie/chapitre-17-couleurs.md
      - Fiche de révision: physique-chimie/chapitre-17-fiche.md
      - Quiz: physique-chimie/chapitre-17-quiz.md
  - Mathématiques:
      - Second degré - Cours: mathematiques/second-degre-partie-1.md
      - Fiche de révision: mathematiques/second-degre-partie-1-fiche.md
      - Quiz: mathematiques/second-degre-partie-1-quiz.md
  - Français:
      - Le Menteur - Cours: francais/le-menteur-corneille.md
      - Fiche de révision: francais/le-menteur-corneille-fiche.md
      - Quiz: francais/le-menteur-corneille-quiz.md
  - SVT:
      - Chapitre 1 - Cours: svt/organisation-cellulaire-du-vivant.md
      - Fiche de révision: svt/organisation-cellulaire-du-vivant-fiche.md
      - Quiz: svt/organisation-cellulaire-du-vivant-quiz.md
  - Anglais:
      - Unit 0 - Cours: anglais/three-truths-two-lies.md
      - Fiche de révision: anglais/three-truths-two-lies-fiche.md
      - Quiz: anglais/three-truths-two-lies-quiz.md
  - Sciences de l'ingénieur:
      - Introduction - Cours: sciences-ingenieur/introduction-sciences-ingenieur.md
      - Fiche de révision: sciences-ingenieur/introduction-sciences-ingenieur-fiche.md
      - Besoin et structure - Cours: sciences-ingenieur/besoin-exigences-structure-systeme.md
      - Besoin et structure - Fiche: sciences-ingenieur/besoin-exigences-structure-systeme-fiche.md
      - Étude de cas AP25 - Cours: sciences-ingenieur/etude-cas-attacheur-ap25.md
      - Étude de cas AP25 - Fiche: sciences-ingenieur/etude-cas-attacheur-ap25-fiche.md

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false