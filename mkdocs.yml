site_name: Bibliothèque scolaire
site_description: Cours, fiches de révision et quiz
site_url: https://drslumppower.github.io/school-library/

theme:
  name: material
  language: fr
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Accueil: index.md
  - Première:
    - Accueil: premiere/index.md
    - Révision du jour: premiere/revision-du-jour.md
    - Physique-chimie:
      - Tronc commun - Éléments chimiques et réactions nucléaires:
        - Récap express: premiere/physique-chimie/elements-chimiques-reactions-nucleaires-recap.md
        - Quiz: premiere/physique-chimie/elements-chimiques-reactions-nucleaires-quiz.md
        - Fiche de révision: premiere/physique-chimie/elements-chimiques-reactions-nucleaires-fiche.md
        - Cours détaillé: premiere/physique-chimie/elements-chimiques-reactions-nucleaires.md
      - Spécialité - Couleurs, vision et synthèses:
        - Récap express: premiere/physique-chimie/chapitre-17-recap.md
        - Quiz: premiere/physique-chimie/chapitre-17-quiz.md
        - Fiche de révision: premiere/physique-chimie/chapitre-17-fiche.md
        - Cours détaillé: premiere/physique-chimie/chapitre-17-couleurs.md
      - Spécialité - Lumière, ondes et particules:
        - Récap express: premiere/physique-chimie/chapitre-18-recap.md
        - Quiz: premiere/physique-chimie/chapitre-18-quiz.md
        - Fiche de révision: premiere/physique-chimie/chapitre-18-fiche.md
        - Cours détaillé: premiere/physique-chimie/chapitre-18-lumiere-ondes-particules.md
